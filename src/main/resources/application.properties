spring.application.name=learning-resource-service

server.port=${SERVER_PORT:8085}


# ===============================
# MySQL Database
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_resource_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:new_password}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Redis Cache Configuration
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
app.cache.resource.ttl-seconds=86400